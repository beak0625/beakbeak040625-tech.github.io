<!-- 마크다운 표 스타일 유지 -->
<style>
  .post-content table, .content table {
    width: 100% !important;
    display: table !important;
    border-collapse: collapse !important;
    margin-bottom: 24px !important;
  }
  .post-content table th, .post-content table td,
  .content table th, .content table td {
    border: 1px solid #ddd !important;
    padding: 12px 16px !important;
    word-break: keep-all !important;
    line-height: 1.6 !important;
  }
  .post-content table th, .content table th {
    background-color: #f8f9fa !important;
    font-weight: bold !important;
    text-align: center !important;
  }

  /* 💡 화면 왼쪽 아래에 무조건 떠 있는 수정 버튼 스타일 (테마 무시) */
  #floating-edit-btn {
    position: fixed;
    bottom: 30px;
    left: 30px;
    z-index: 999999; /* 화면 최상단에 무조건 노출 */
    background-color: #222;
    color: #fff !important;
    padding: 12px 24px;
    border-radius: 50px;
    font-weight: bold;
    font-size: 15px;
    text-decoration: none;
    box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    transition: 0.2s;
  }
  #floating-edit-btn:hover {
    background-color: #555;
    transform: scale(1.05);
  }
</style>

<!-- 게시글 수정 버튼 화면 전체에 강제 부착 -->
{% if page.layout == 'post' %}
<script>
  setInterval(function() {
    // 버튼이 없고 화면(body)이 존재하면 무조건 생성
    if (!document.getElementById("floating-edit-btn") && document.body) {
      var btn = document.createElement("a");
      btn.id = "floating-edit-btn";
      
      // Liquid로 파일명 완벽 추출
      var fileName = "{{ page.path | split: '/' | last | split: '.' | first }}";
      btn.href = "/admin/#/collections/posts/entries/" + fileName;
      btn.innerHTML = "✏️ 이 글 수정하기";
      
      // 본문 위치 찾을 필요 없이 화면(body)에 직접 꽂아넣음
      document.body.appendChild(btn);
    }
  }, 300); // 0.3초마다 끈질기게 확인
</script>
{% endif %}
