<style>
  /* 1. 마크다운 표 100% 확장 및 한글 줄바꿈 고정 */
  .table-wrapper {
    width: 100% !important;
    overflow-x: visible !important;
  }
  .table-wrapper > table,
  .post-content table,
  .content table,
  article table {
    width: 100% !important;
    display: table !important;
    border-collapse: collapse !important;
    margin-bottom: 24px !important;
    table-layout: auto !important;
  }
  .post-content table th, .post-content table td,
  .content table th, .content table td,
  .table-wrapper table th, .table-wrapper table td {
    border: 1px solid #ddd !important;
    padding: 12px 16px !important;
    word-break: keep-all !important;
    line-height: 1.6 !important;
    text-align: left !important;
  }
  .post-content table th, .content table th, .table-wrapper table th {
    background-color: #f8f9fa !important;
    font-weight: bold !important;
    text-align: center !important;
  }

  /* 2. 본문 문단 사이 기본 줄바꿈 여백 확보 */
  .content p, .post-content p {
    margin-bottom: 1.4rem !important;
    line-height: 1.8 !important;
  }

  /* 3. 본문 전체 요소(문단, 제목, 리스트) 강제 왼쪽 정렬 및 들여쓰기 완전 제거 */
  .content, .post-content {
    text-align: left !important;
  }
  .content p, .post-content p,
  .content h1, .content h2, .content h3, .content h4, .content h5, .content h6,
  .post-content h1, .post-content h2, .post-content h3, .post-content h4, .post-content h5, .post-content h6,
  .content div, .post-content div {
    margin-left: 0 !important;
    padding-left: 0 !important;
    text-indent: 0 !important;
    text-align: left !important;
  }
  .content ul, .content ol,
  .post-content ul, .post-content ol {
    margin-left: 0 !important;
    padding-left: 0 !important;
    list-style-position: inside !important;
    text-align: left !important;
  }
  .content li, .post-content li {
    margin-left: 0 !important;
    padding-left: 0 !important;
    text-indent: 0 !important;
    text-align: left !important;
    margin-bottom: 0.6rem !important;
    line-height: 1.8 !important;
  }
  .content li > p, .post-content li > p {
    display: inline !important;
    margin: 0 !important;
    padding: 0 !important;
  }

  /* 4. [순수 CSS] 게시글(article)이 있는 페이지에서는 우측 사이드바(최근글/태그) 완전 숨김 & 본문 폭 100% 확장 */
  body:has(main article) #panel-wrapper,
  #main-wrapper:has(article) #panel-wrapper,
  .row:has(article) #panel-wrapper,
  .row:has(.post-tail-wrapper) #panel-wrapper {
    display: none !important;
    width: 0 !important;
  }

  body:has(main article) main,
  #main-wrapper:has(article) main,
  .row:has(article) > main,
  .row:has(.post-tail-wrapper) > main {
    flex: 0 0 100% !important;
    max-width: 100% !important;
    width: 100% !important;
  }
</style>

<!-- 블로그 전체 수학 수식($...$ 및 $$...$$) 자동 렌더링 엔진 -->
<script>
  window.MathJax = {
    tex: {
      inlineMath: [['$', '$'], ['\\(', '\\)']],
      displayMath: [['$$', '$$'], ['\\[', '\\]']]
    }
  };
</script>
