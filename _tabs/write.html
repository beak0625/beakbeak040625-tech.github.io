<script>
  window.addEventListener('DOMContentLoaded', async function() {
    var params = new URLSearchParams(window.location.search);
    var editFile = params.get('edit');
    if (!editFile) return;

    try {
      var res = await fetch('https://api.github.com/repos/beakbeak040625-tech/beakbeak040625-tech.github.io/contents/_posts/' + encodeURIComponent(editFile));
      if (!res.ok) return;
      var fileData = await res.json();
      var raw = decodeURIComponent(escape(atob(fileData.content.replace(/\n/g, ''))));

      var titleInput = document.querySelector('input[placeholder*="제목"], input[id*="title"], .title-input') || document.querySelectorAll('input[type="text"]')[0];
      var tagInput = document.querySelector('input[placeholder*="태그"], input[id*="tag"]');
      var editorArea = document.querySelector('textarea') || document.querySelector('[contenteditable="true"]');

      var match = raw.match(/^---\r?\n([\s\S]*?)\r?\n---\r?\n([\s\S]*)$/);
      if (match) {
        var yaml = match[1];
        var body = match[2].trim();

        var titleMatch = yaml.match(/title:\s*["']?(.*?)["']?\s*$/m);
        var tagMatch = yaml.match(/tags:\s*\[(.*?)\]/m);

        if (titleMatch && titleInput) {
          titleInput.value = titleMatch[1];
          titleInput.dispatchEvent(new Event('input'));
        }
        if (tagMatch && tagInput) {
          tagInput.value = tagMatch[1].replace(/["']/g, '');
          tagInput.dispatchEvent(new Event('input'));
        }
        if (editorArea) {
          if (editorArea.tagName === 'TEXTAREA') {
            editorArea.value = body;
          } else {
            editorArea.innerText = body;
          }
          editorArea.dispatchEvent(new Event('input'));
        }
      }
    } catch (e) {
      console.error('원본 글 로드 실패:', e);
    }
  });
</script>
