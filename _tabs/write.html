<style>

<div class="custom-editor-box">
  <!-- 상단 헤더 -->
  <div class="ce-header">
    <h2 class="ce-title" id="ce-header-title">✒️ 블로그 게시글 작성</h2>
    <div class="ce-btn-group">
      <button type="button" class="ce-btn" onclick="window.setupGithubToken()">🔑 GitHub 연동 설정</button>
      <a href="/" class="ce-btn">🏠 블로그 홈</a>
      <button type="button" class="ce-btn-primary" id="ce-submit-btn" onclick="window.submitPostToGithub()">☁️ 게시글 등록하기</button>
    </div>
  </div>

  <!-- 카테고리 / 제목 / 태그 입력줄 -->
  <div class="ce-meta-row">
    <select id="ce-category" class="ce-select">
      <option value="Paper Review">1. 논문 리뷰 (Paper Review)</option>
      <option value="Security">2. 보안 연구 (Security)</option>
      <option value="Development">3. 개발 및 프로젝트 (Development)</option>
      <option value="Bug Bounty">4. 버그바운티 & 워게임 (Bug Bounty)</option>
      <option value="Award">5. 공모전 및 자격증 (Award & Cert)</option>
      <option value="Memoir">6. 회고 및 기록 (Memoir)</option>
    </select>
    <input type="text" id="ce-title" class="ce-input ce-input-title" placeholder="게시글 제목을 입력하세요">
    <input type="text" id="ce-tags" class="ce-input" placeholder="태그 입력 (쉼표로 구분: NDSS, Firmware)">
  </div>

  <!-- 편집 도구 모음 (툴바) -->
  <div class="ce-toolbar">
    <select class="ce-tool-btn" onchange="window.insertHeading(this.value); this.value='';">
      <option value="">문단 제목</option>
      <option value="1">대제목 (1.5em)</option>
      <option value="2">중제목 (1.2em)</option>
      <option value="3">소제목 (###)</option>

    <div class="ce-divider"></div>
    <button type="button" class="ce-tool-btn" onclick="window.wrapSelection('**', '**')" title="굵게"><b>B</b></button>
    <button type="button" class="ce-tool-btn" onclick="window.wrapSelection('*', '*')" title="기울임"><i>I</i></button>
    <button type="button" class="ce-tool-btn" onclick="window.wrapSelection('<u>', '</u>')" title="밑줄"><u>U</u></button>
    <button type="button" class="ce-tool-btn" onclick="window.wrapSelection('~~', '~~')" title="취소선"><s>S</s></button>
    <button type="button" class="ce-tool-btn" onclick="window.wrapSelection('<mark style=&quot;background:#fff3b0;&quot;>', '</mark>')">🖍️ 형광펜</button>
    <div class="ce-divider"></div>
    <button type="button" class="ce-tool-btn" onclick="window.insertTableTemplate()">⊞ 표 삽입</button>
    <button type="button" class="ce-tool-btn" onclick="window.insertPaperTemplate()">📄 논문 템플릿</button>
    <button type="button" class="ce-tool-btn" onclick="window.wrapSelection('```\n', '\n```')">&lt;/&gt; 코드</button>
    <button type="button" class="ce-tool-btn" onclick="window.wrapSelection('$$', '$$')">√x 수식</button>
    <button type="button" class="ce-tool-btn" onclick="window.insertAtCursor('\n<br>\n')">↵ 줄바꿈(&lt;br&gt;)</button>

  <!-- 좌측 마크다운 입력창 & 우측 실시간 미리보기 -->
  <div class="ce-workspace">

  <div class="ce-footer">
    <span id="ce-status-left">작성 모드 대기 중</span>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script>
(function() {
  var REPO_OWNER = 'beakbeak040625-tech';
  var REPO_NAME = 'beakbeak040625-tech.github.io';

  var titleEl = document.getElementById('ce-title');
  var catEl = document.getElementById('ce-category');
  var tagsEl = document.getElementById('ce-tags');
  var bodyEl = document.getElementById('ce-body');
  var previewEl = document.getElementById('ce-preview');
  var headerTitleEl = document.getElementById('ce-header-title');
  var submitBtnEl = document.getElementById('ce-submit-btn');
  var statusLeftEl = document.getElementById('ce-status-left');

  var isEditMode = false;
  var editFilename = null;
  var editFileSha = null;
  var originalDate = null;

  // 1. 실시간 미리보기 렌더링 (표 & 수식 & 줄바꿈 완벽 반영)
  function renderPreview() {
    var md = bodyEl.value || '';
    if (window.marked) {
      marked.setOptions({ breaks: true, gfm: true });
      previewEl.innerHTML = marked.parse(md);
    } else {
      previewEl.innerHTML = md.replace(/\n/g, '<br>');
    }
    if (window.MathJax && window.MathJax.typesetPromise) {
      window.MathJax.typesetPromise([previewEl]).catch(function(){});
    }
  }

  bodyEl.addEventListener('input', function() {
    renderPreview();
    // 수정 모드가 아닐 때만 일반 임시저장 작동 (수정 모드에서 기존 글을 덮어쓰는 현상 원천 차단)
    if (!isEditMode) {
      localStorage.setItem('draft_post_title', titleEl.value);
      localStorage.setItem('draft_post_cat', catEl.value);
      localStorage.setItem('draft_post_tags', tagsEl.value);
      localStorage.setItem('draft_post_body', bodyEl.value);
    }
  });

  // 2. 툴바 편의 기능들
  window.wrapSelection = function(prefix, suffix) {
    var start = bodyEl.selectionStart;
    var end = bodyEl.selectionEnd;
    var selected = bodyEl.value.substring(start, end) || '텍스트';
    bodyEl.setRangeText(prefix + selected + suffix, start, end, 'end');
    bodyEl.focus();
    renderPreview();
  };

  window.insertAtCursor = function(text) {
    var start = bodyEl.selectionStart;
    bodyEl.setRangeText(text, start, bodyEl.selectionEnd, 'end');
    bodyEl.focus();
    renderPreview();
  };

  window.insertHeading = function(level) {
    if (!level) return;
    if (level === '1') window.wrapSelection('<span style="font-size:1.5em;">', '</span>\n<br>\n');
    if (level === '2') window.wrapSelection('<span style="font-size:1.2em;">', '</span>\n<br>\n');
    if (level === '3') window.insertAtCursor('\n### 제목\n');
  };

  window.insertTableTemplate = function() {
    var tbl = '\n\n| 항목 | 설명 | 비고 |\n| :--- | :--- | :--- |\n| 내용 1 | 설명 1 | 비고 1 |\n| 내용 2 | 설명 2 | 비고 2 |\n\n';
    window.insertAtCursor(tbl);
  };

  window.insertPaperTemplate = function() {
    var tpl = '선정 논문: \n\n게재 학회 및 연도: \n\n저자: \n\n<span style="font-size:1.5em;">1. 이 논문의 배경 및 문제 정의</span>\n<br>\n\n<span style="font-size:1.5em;">2. 핵심 아이디어 및 시스템 구성</span>\n<br>\n\n<span style="font-size:1.5em;">3. 실험 평가 및 한계점</span>\n<br>\n\n<span style="font-size:1.5em;">4. 느낀점 및 인사이트</span>\n<br>\n';
    window.insertAtCursor(tpl);
  };

  // 3. GitHub 토큰 설정 (기존에 저장된 모든 키 호환)
  function getSavedToken() {
    var token = localStorage.getItem('gh_pat_token') || localStorage.getItem('github_token') || localStorage.getItem('token');
    if (token) return token;
    for (var i = 0; i < localStorage.length; i++) {
      var v = localStorage.getItem(localStorage.key(i));
      if (v && (v.startsWith('ghp_') || v.startsWith('github_pat_'))) return v;
    }
    return '';
  }

  window.setupGithubToken = function() {
    var current = getSavedToken();
    var input = prompt('GitHub Personal Access Token (repo 권한)을 입력해주세요:', current);
    if (input !== null && input.trim() !== '') {
      localStorage.setItem('gh_pat_token', input.trim());
      alert('GitHub 토큰이 안전하게 저장되었습니다.');
    }
  };

  // 4. 마크다운 원문에서 Front Matter(제목, 카테고리, 태그, 날짜)와 본문 분리해 에디터에 채우기
  function parseAndFillMarkdown(rawMarkdown, filename) {
    isEditMode = true;
    editFilename = filename;
    headerTitleEl.innerText = '✏️ 블로그 게시글 수정 (' + filename + ')';
    submitBtnEl.innerText = '☁️ 게시글 수정 완료하기';
    statusLeftEl.innerText = '수정 모드: ' + filename;

    var match = rawMarkdown.match(/^---\r?\n([\s\S]*?)\r?\n---\r?\n([\s\S]*)$/);
    var body = rawMarkdown;

    if (match) {
      var yaml = match[1];
      body = match[2].replace(/^\r?\n/, '');

      var titleMatch = yaml.match(/title:\s*["']?(.*?)["']?\s*$/m);
      if (titleMatch) titleEl.value = titleMatch[1].replace(/\\"/g, '"');

      var dateMatch = yaml.match(/date:\s*(.*?)\s*$/m);
      if (dateMatch) originalDate = dateMatch[1].trim();

      var catMatch = yaml.match(/categories:\s*\[?\s*["']?([^"'\],\r\n]+)["']?/m);
      if (catMatch) {
        var catVal = catMatch[1].trim();
        var found = false;
        for (var i = 0; i < catEl.options.length; i++) {
          if (catEl.options[i].value === catVal || catEl.options[i].text.includes(catVal)) {
            catEl.selectedIndex = i;
            found = true;
            break;
          }
        }
        if (!found) {
          var newOpt = document.createElement('option');
          newOpt.value = catVal;
          newOpt.text = catVal;
          catEl.appendChild(newOpt);
          catEl.value = catVal;
        }
      }

      var tagMatch = yaml.match(/tags:\s*\[(.*?)\]/m);
      if (tagMatch) {
        tagsEl.value = tagMatch[1].replace(/["']/g, '').split(',').map(function(s){return s.trim();}).filter(Boolean).join(', ');
      }
    }

    bodyEl.value = body;
    renderPreview();
  }

  // 5. 페이지 진입 시 '수정 모드'인지 확인하여 원본 글 즉시 로드 (백지 현상 완전 차단)
  async function initEditor() {
    var params = new URLSearchParams(window.location.search);
    var urlEditFile = params.get('edit');
    var storedRaw = localStorage.getItem('chirpy_edit_raw');
    var storedFile = localStorage.getItem('chirpy_edit_filename');

    // 경로 A: 플러그인 버튼에서 즉시 전달된 원본 데이터가 있는 경우 (0.01초 즉시 복원)
    if (storedRaw && storedFile) {
      localStorage.removeItem('chirpy_edit_raw');
      localStorage.removeItem('chirpy_edit_filename');
      parseAndFillMarkdown(storedRaw, storedFile);
      return;
    }

    // 경로 B: 주소창에 ?edit=파일명.md 로 넘어온 경우 GitHub API에서 원본 직접 로드
    if (urlEditFile) {
      statusLeftEl.innerText = '⏳ 원본 게시글을 불러오는 중입니다...';
      try {
        var apiUrl = 'https://api.github.com/repos/' + REPO_OWNER + '/' + REPO_NAME + '/contents/_posts/' + encodeURIComponent(urlEditFile) + '?t=' + Date.now();
        var headers = {};
        var token = getSavedToken();
        if (token) headers['Authorization'] = 'token ' + token;

        var res = await fetch(apiUrl, { headers: headers });
        if (res.ok) {
          var data = await res.json();
          editFileSha = data.sha;
          var bin = atob(data.content.replace(/\s/g, ''));
          var bytes = new Uint8Array(bin.length);
          for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
          var rawText = new TextDecoder('utf-8').decode(bytes);
          parseAndFillMarkdown(rawText, urlEditFile);
          return;
        }
      } catch (e) {
        console.error('원본 로드 실패:', e);
      }
    }

    // 경로 C: 새 글 작성 모드일 때만 이전 작성 중이던 임시저장 불러오기
    var dTitle = localStorage.getItem('draft_post_title');
    var dBody = localStorage.getItem('draft_post_body');
    if (dTitle || dBody) {
      titleEl.value = dTitle || '';
      tagsEl.value = localStorage.getItem('draft_post_tags') || '';
      bodyEl.value = dBody || '';
      renderPreview();
    }
  }

  // 6. 게시글 등록 및 수정(덮어쓰기) 실행
  window.submitPostToGithub = async function() {
    var token = getSavedToken();
    if (!token) {
      token = prompt('글 등록/수정을 위해 GitHub Personal Access Token (ghp_...)을 입력해주세요:');
      if (!token) return;
      localStorage.setItem('gh_pat_token', token.trim());
    }

    var title = titleEl.value.trim();
    var category = catEl.value.trim();
    var tagsArr = tagsEl.value.split(',').map(function(s){ return s.trim(); }).filter(Boolean);
    var tagsFormatted = tagsArr.map(function(t){ return '"' + t + '"'; }).join(', ');
    var body = bodyEl.value;

    if (!title) {
      alert('게시글 제목을 입력해주세요.');
      titleEl.focus();
      return;
    }

    submitBtnEl.disabled = true;
    submitBtnEl.innerText = '⏳ GitHub에 반영 중...';

    try {
      var now = new Date();
      var yyyy = now.getFullYear();
      var mm = String(now.getMonth() + 1).padStart(2, '0');
      var dd = String(now.getDate()).padStart(2, '0');
      var hh = String(now.getHours()).padStart(2, '0');
      var min = String(now.getMinutes()).padStart(2, '0');
      var ss = String(now.getSeconds()).padStart(2, '0');

      var dateStr = isEditMode && originalDate ? originalDate : (yyyy + '-' + mm + '-' + dd + ' ' + hh + ':' + min + ':' + ss + ' +0900');
      var slug = title.toLowerCase().replace(/[^a-z0-9가-힣]+/g, '-').replace(/^-|-$/g, '') || 'post';
      var targetFile = isEditMode && editFilename ? editFilename : (yyyy + '-' + mm + '-' + dd + '-' + slug + '.md');

      var finalMarkdown = '---\n' +
                          'title: "' + title.replace(/"/g, '\\"') + '"\n' +
                          'date: ' + dateStr + '\n' +
                          'categories: ["' + category + '"]\n' +
                          'tags: [' + (tagsFormatted || '"' + category + '"') + ']\n' +
                          'math: true\n' +
                          '---\n\n' + body;

      var apiUrl = 'https://api.github.com/repos/' + REPO_OWNER + '/' + REPO_NAME + '/contents/_posts/' + encodeURIComponent(targetFile);

      // 기존 파일이 있는지(수정 모드) 확인하여 sha 값 확보
      var sha = editFileSha;
      if (!sha) {
        var checkRes = await fetch(apiUrl, { headers: { 'Authorization': 'token ' + token } });
        if (checkRes.ok) {
          var existing = await checkRes.json();
          sha = existing.sha;
        }
      }

      var utf8Bytes = new TextEncoder().encode(finalMarkdown);
      var binary = '';
      for (var i = 0; i < utf8Bytes.length; i++) binary += String.fromCharCode(utf8Bytes[i]);
      var contentBase64 = btoa(binary);

      var payload = {
        message: (isEditMode ? 'Update post: ' : 'Create post: ') + targetFile,
        content: contentBase64
      };
      if (sha) payload.sha = sha;

      var putRes = await fetch(apiUrl, {
        method: 'PUT',
        headers: {
          'Authorization': 'token ' + token,
          'Content-Type': 'application/json'
        },
        body: JSON.stringify(payload)
      });

      if (putRes.ok) {
        if (!isEditMode) {
          localStorage.removeItem('draft_post_title');
          localStorage.removeItem('draft_post_body');
        }
        alert(isEditMode ? '게시글 수정이 완료되었습니다! (약 1분 뒤 반영됩니다)' : '새 게시글이 등록되었습니다! (약 1분 뒤 반영됩니다)');
        window.location.href = '/';
      } else {
        var err = await putRes.json();
        alert('저장 실패: ' + (err.message || 'GitHub 토큰 권한을 확인해주세요.'));
      }
    } catch (e) {
      alert('오류 발생: ' + e.message);
    } finally {
      submitBtnEl.disabled = false;
      submitBtnEl.innerText = isEditMode ? '☁️ 게시글 수정 완료하기' : '☁️ 게시글 등록하기';
    }
  };

  initEditor();
})();
</script>
