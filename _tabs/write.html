<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>블로그 포스트 작성기 | beakbeak040625-tech</title>
  <!-- Markdown 렌더링(미리보기) 및 아이콘 라이브러리 -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg-main: #f7f3eb;
      --bg-card: #ffffff;
      --border-color: #dcd3c2;
      --accent: #8c6239;
      --accent-hover: #6e4b2a;
      --text-main: #2c2520;
      --text-muted: #786d63;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-main);
      color: var(--text-main);
      padding: 20px;
    }

    .editor-container {
      max-width: 1400px;
      margin: 0 auto;
      background: var(--bg-card);
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.06);
      border: 1px solid var(--border-color);
      overflow: hidden;
    }

    /* 상단 헤더 */
    .editor-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 24px;
      background: #eee7da;
      border-bottom: 1px solid var(--border-color);
    }
    .editor-header h1 {
      font-size: 1.25rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .header-actions {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    /* 버튼 스타일 */
    .btn {
      padding: 9px 16px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      background: #fff;
      color: var(--text-main);
      font-weight: 600;
      cursor: pointer;
      font-size: 0.9rem;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s;
    }
    .btn:hover { background: #f3efe6; }
    .btn-primary {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }
    .btn-primary:hover { background: var(--accent-hover); }

    /* 설정 바 (GitHub 토큰 및 레포지토리 정보) */
    .config-bar {
      padding: 12px 24px;
      background: #faf8f4;
      border-bottom: 1px solid var(--border-color);
      display: none;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      font-size: 0.85rem;
    }
    .config-bar.active { display: flex; }
    .config-bar input {
      padding: 6px 10px;
      border: 1px solid var(--border-color);
      border-radius: 4px;
      font-size: 0.85rem;
    }

    /* 메타데이터 입력 영역 (제목, 카테고리, 태그) */
    .meta-section {
      padding: 20px 24px;
      border-bottom: 1px solid var(--border-color);
      display: grid;
      grid-template-columns: 240px 1fr 260px;
      gap: 12px;
    }
    .meta-section select,
    .meta-section input {
      padding: 12px 14px;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      font-size: 1rem;
      outline: none;
    }
    .meta-section input#postTitle {
      font-weight: 700;
      font-size: 1.1rem;
    }
    .meta-section select:focus,
    .meta-section input:focus {
      border-color: var(--accent);
    }

    /* 네이버 블로그 스타일 툴바 */
    .toolbar {
      padding: 10px 24px;
      background: #faf8f4;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
    }
    .toolbar select {
      padding: 6px 8px;
      border: 1px solid var(--border-color);
      border-radius: 4px;
      background: #fff;
      font-size: 0.85rem;
      cursor: pointer;
    }
    .toolbar-btn {
      width: 34px;
      height: 34px;
      border: 1px solid transparent;
      background: transparent;
      border-radius: 4px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--text-main);
      font-size: 0.95rem;
    }
    .toolbar-btn:hover {
      background: #e9e2d4;
      border-color: var(--border-color);
    }
    .toolbar-divider {
      width: 1px;
      height: 22px;
      background: var(--border-color);
      margin: 0 4px;
    }
    .color-picker-wrapper {
      display: inline-flex;
      align-items: center;
      position: relative;
      gap: 3px;
      padding: 0 6px;
      border: 1px solid var(--border-color);
      border-radius: 4px;
      background: #fff;
      height: 34px;
      font-size: 0.8rem;
    }
    .color-picker-wrapper input[type="color"] {
      border: none;
      width: 22px;
      height: 22px;
      cursor: pointer;
      background: none;
    }

    /* 본문 에디터 & 실시간 미리보기 분할 레이아웃 */
    .workspace {
      display: grid;
      grid-template-columns: 1fr 1fr;
      height: 65vh;
      min-height: 500px;
    }
    .editor-pane {
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
    }
    textarea#postContent {
      width: 100%;
      height: 100%;
      border: none;
      padding: 24px;
      font-size: 1rem;
      line-height: 1.7;
      resize: none;
      outline: none;
      font-family: 'JetBrains Mono', 'Pretendard', monospace, sans-serif;
    }
    .preview-pane {
      padding: 24px;
      overflow-y: auto;
      background: #fdfcfa;
      line-height: 1.75;
    }
    .preview-pane h1, .preview-pane h2, .preview-pane h3 {
      margin-top: 1.2em;
      margin-bottom: 0.6em;
      border-bottom: 1px solid #eee;
      padding-bottom: 0.3em;
    }
    .preview-pane table {
      width: 100%;
      border-collapse: collapse;
      margin: 16px 0;
    }
    .preview-pane th, .preview-pane td {
      border: 1px solid #ccc;
      padding: 8px 12px;
      text-align: left;
    }
    .preview-pane th { background: #f2ede2; }
    .preview-pane pre {
      background: #282c34;
      color: #abb2bf;
      padding: 14px;
      border-radius: 6px;
      overflow-x: auto;
      margin: 12px 0;
    }
    .preview-pane blockquote {
      border-left: 4px solid var(--accent);
      padding-left: 14px;
      color: var(--text-muted);
      margin: 12px 0;
    }

    /* 하단 상태바 */
    .status-bar {
      padding: 12px 24px;
      background: #eee7da;
      border-top: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    /* 모달 창 (표 생성기) */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.45);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 999;
    }
    .modal-overlay.active { display: flex; }
    .modal {
      background: #fff;
      padding: 24px;
      border-radius: 10px;
      width: 360px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }
    .modal h3 { margin-bottom: 16px; font-size: 1.1rem; }
    .modal-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .modal-row input[type="number"] {
      width: 90px;
      padding: 6px 10px;
      border: 1px solid var(--border-color);
      border-radius: 4px;
    }
    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 20px;
    }

    @media (max-width: 900px) {
      .meta-section { grid-template-columns: 1fr; }
      .workspace { grid-template-columns: 1fr; height: auto; }
      .editor-pane { height: 450px; border-right: none; border-bottom: 1px solid var(--border-color); }
      .preview-pane { height: 400px; }
    }
  </style>
</head>
<body>

<div class="editor-container">
  <!-- 상단바 -->
  <div class="editor-header">
    <h1>
      <i class="fa-solid fa-pen-nib"></i>
      블로그 게시글 작성
    </h1>
    <div class="header-actions">
      <button class="btn" onclick="toggleConfig()">
        <i class="fa-solid fa-key"></i> GitHub 연동 설정
      </button>
      <a href="/" class="btn" style="text-decoration:none;">
        <i class="fa-solid fa-house"></i> 블로그 홈
      </a>
      <button class="btn btn-primary" onclick="publishPost()" id="publishBtn">
        <i class="fa-solid fa-cloud-arrow-up"></i> 게시글 등록하기
      </button>
    </div>
  </div>

  <!-- GitHub API 설정창 (토큰 저장용) -->
  <div class="config-bar" id="configBar">
    <span><strong>Owner:</strong></span>
    <input type="text" id="ghOwner" value="beakbeak040625-tech" style="width:170px;">
    <span><strong>Repo:</strong></span>
    <input type="text" id="ghRepo" value="beakbeak040625-tech.github.io" style="width:230px;">
    <span><strong>Branch:</strong></span>
    <input type="text" id="ghBranch" value="main" style="width:80px;">
    <span><strong>GitHub Token (PAT):</strong></span>
    <input type="password" id="ghToken" placeholder="ghp_xxxxxxxxxxxx" style="width:240px;">
    <button class="btn" onclick="saveConfig()">저장</button>
    <span style="color:#666;">* 토큰은 브라우저(LocalStorage)에만 안전하게 보관됩니다.</span>
  </div>

  <!-- 제목 / 6대 카테고리 / 태그 입력 -->
  <div class="meta-section">
    <select id="postCategory" title="카테고리 선택 (6종)">
      <option value="Paper Review">1. 논문 리뷰 (Paper Review)</option>
      <option value="Vulnerability Analysis">2. 취약점 분석 (Vulnerability)</option>
      <option value="Wargame & CTF">3. 워게임 & CTF (Wargame & CTF)</option>
      <option value="System & Network">4. 시스템 & 네트워크 보안</option>
      <option value="Malware Analysis">5. 악성코드 분석 (Malware)</option>
      <option value="Dev & Project">6. 개발 & 프로젝트 (Dev & Project)</option>
    </select>
    <input type="text" id="postTitle" placeholder="논문 제목 또는 게시글 제목을 입력하세요..." oninput="updatePreview()">
    <input type="text" id="postTags" placeholder="태그 입력 (쉼표로 구분: NDSS, Firmware)">
  </div>

  <!-- 네이버 블로그형 다기능 툴바 -->
  <div class="toolbar">
    <!-- 글꼴 변경 -->
    <select onchange="applyFontFamily(this.value); this.selectedIndex=0;">
      <option value="">글꼴 선택</option>
      <option value="'Pretendard', sans-serif">기본 고딕 (Pretendard)</option>
      <option value="'Nanum Myeongjo', serif">명조체 (논문/인용)</option>
      <option value="'JetBrains Mono', monospace">고정폭 (코드/메모리주소)</option>
    </select>

    <!-- 글자 크기 변경 -->
    <select onchange="applyFontSize(this.value); this.selectedIndex=0;">
      <option value="">글자 크기</option>
      <option value="0.85em">작게 (13px)</option>
      <option value="1.0em">보통 (16px)</option>
      <option value="1.2em">조금 크게 (19px)</option>
      <option value="1.5em">크게 (24px)</option>
      <option value="1.85em">아주 크게 (30px)</option>
    </select>

    <!-- 제목(Heading) 스타일 -->
    <select onchange="insertHeading(this.value); this.selectedIndex=0;">
      <option value="">문단 제목</option>
      <option value="## ">대제목 (H2)</option>
      <option value="### ">중제목 (H3)</option>
      <option value="#### ">소제목 (H4)</option>
    </select>

    <div class="toolbar-divider"></div>

    <!-- 기본 서식 -->
    <button class="toolbar-btn" title="굵게 (Bold)" onclick="wrapSelection('**', '**')"><i class="fa-solid fa-bold"></i></button>
    <button class="toolbar-btn" title="기울임 (Italic)" onclick="wrapSelection('*', '*')"><i class="fa-solid fa-italic"></i></button>
    <button class="toolbar-btn" title="밑줄 (Underline)" onclick="wrapSelection('<u>', '</u>')"><i class="fa-solid fa-underline"></i></button>
    <button class="toolbar-btn" title="취소선 (Strikethrough)" onclick="wrapSelection('~~', '~~')"><i class="fa-solid fa-strikethrough"></i></button>

    <div class="toolbar-divider"></div>

    <!-- 글자 색상 & 형광펜 -->
    <div class="color-picker-wrapper" title="글자 색상 적용">
      <i class="fa-solid fa-font" style="color:#d9534f;"></i>
      <input type="color" id="foreColorPicker" value="#d9534f">
      <button class="btn" style="padding:2px 6px; font-size:0.75rem;" onclick="applyTextColor()">적용</button>
    </div>

    <div class="color-picker-wrapper" title="형광펜 배경색 적용">
      <i class="fa-solid fa-highlighter" style="color:#f0ad4e;"></i>
      <input type="color" id="bgColorPicker" value="#fff3a8">
      <button class="btn" style="padding:2px 6px; font-size:0.75rem;" onclick="applyBgColor()">형광펜</button>
    </div>

    <div class="toolbar-divider"></div>

    <!-- 논문 리뷰 필수 요소: 표 생성, 수식, 코드블록, 인용구 -->
    <button class="toolbar-btn" title="표(Table) 생성기" onclick="openTableModal()" style="width:auto; padding:0 10px; font-weight:600; color:var(--accent);">
      <i class="fa-solid fa-table" style="margin-right:5px;"></i> 표 삽입
    </button>
    <button class="toolbar-btn" title="논문 리뷰 템플릿 불러오기" onclick="insertPaperTemplate()" style="width:auto; padding:0 10px; font-weight:600;">
      <i class="fa-solid fa-file-lines" style="margin-right:5px;"></i> 논문 템플릿
    </button>
    <button class="toolbar-btn" title="코드 블록 삽입" onclick="insertCodeBlock()"><i class="fa-solid fa-code"></i></button>
    <button class="toolbar-btn" title="LaTeX 수식 삽입" onclick="wrapSelection('$$\n', '\n$$')"><i class="fa-solid fa-square-root-variable"></i></button>
    <button class="toolbar-btn" title="인용구 (Blockquote)" onclick="insertPrefix('> ')"><i class="fa-solid fa-quote-left"></i></button>
    <button class="toolbar-btn" title="글머리 기호 목록" onclick="insertPrefix('- ')"><i class="fa-solid fa-list-ul"></i></button>
    <button class="toolbar-btn" title="구분선 삽입" onclick="insertText('\n---\n')"><i class="fa-solid fa-minus"></i></button>
    <button class="toolbar-btn" title="링크 삽입" onclick="insertLink()"><i class="fa-solid fa-link"></i></button>
    <button class="toolbar-btn" title="이미지 URL 삽입" onclick="insertImage()"><i class="fa-regular fa-image"></i></button>
  </div>

  <!-- 에디터 & 실시간 미리보기 영역 -->
  <div class="workspace">
    <div class="editor-pane">
      <textarea id="postContent" placeholder="여기에 내용을 작성하세요. 상단 툴바에서 표 만들기, 폰트 조정, 논문 리뷰 템플릿을 바로 사용할 수 있습니다." oninput="updatePreview()"></textarea>
    </div>
    <div class="preview-pane" id="previewArea">
      <p style="color:#999;">우측 화면에 실시간 미리보기가 표시됩니다.</p>
    </div>
  </div>

  <!-- 하단 상태 표시줄 -->
  <div class="status-bar">
    <span id="currentTimeDisplay">현재 작성 시각: 계산 중...</span>
    <span id="statusMsg">임시저장: 자동 활성화됨</span>
  </div>
</div>

<!-- 표(Table) 생성 모달 -->
<div class="modal-overlay" id="tableModal">
  <div class="modal">
    <h3><i class="fa-solid fa-table"></i> 표(Table) 만들기</h3>
    <div class="modal-row">
      <label>행(Row) 개수 (데이터 줄 수):</label>
      <input type="number" id="tableRows" value="3" min="1" max="30">
    </div>
    <div class="modal-row">
      <label>열(Column) 개수 (항목 수):</label>
      <input type="number" id="tableCols" value="3" min="1" max="12">
    </div>
    <div class="modal-row">
      <label>정렬 방식:</label>
      <select id="tableAlign" style="padding:6px; border:1px solid #ccc; border-radius:4px;">
        <option value="left">왼쪽 정렬</option>
        <option value="center">가운데 정렬</option>
        <option value="right">오른쪽 정렬</option>
      </select>
    </div>
    <div class="modal-actions">
      <button class="btn" onclick="closeTableModal()">취소</button>
      <button class="btn btn-primary" onclick="generateMarkdownTable()">표 삽입하기</button>
    </div>
  </div>
</div>

<script>
  const contentArea = document.getElementById('postContent');
  const previewArea = document.getElementById('previewArea');

  // 초기 로드 시 저장된 GitHub 설정 및 임시저장 글 불러오기
  window.addEventListener('DOMContentLoaded', () => {
    const savedOwner = localStorage.getItem('gh_owner');
    const savedRepo = localStorage.getItem('gh_repo');
    const savedBranch = localStorage.getItem('gh_branch');
    const savedToken = localStorage.getItem('gh_token');

    if (savedOwner) document.getElementById('ghOwner').value = savedOwner;
    if (savedRepo) document.getElementById('ghRepo').value = savedRepo;
    if (savedBranch) document.getElementById('ghBranch').value = savedBranch;
    if (savedToken) document.getElementById('ghToken').value = savedToken;

    if (!savedToken) {
      document.getElementById('configBar').classList.add('active');
    }

    // 임시저장 복원
    const draftTitle = localStorage.getItem('draft_title');
    const draftContent = localStorage.getItem('draft_content');
    if (draftTitle) document.getElementById('postTitle').value = draftTitle;
    if (draftContent) {
      contentArea.value = draftContent;
      updatePreview();
    }

    updateClock();
    setInterval(updateClock, 1000);
  });

  // 실시간 시계 (KST)
  function updateClock() {
    const now = new Date();
    document.getElementById('currentTimeDisplay').textContent =
      `작성 기준 시각: ${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}:${String(now.getSeconds()).padStart(2,'0')} (등록 시 자동 기록)`;
  }

  function toggleConfig() {
    document.getElementById('configBar').classList.toggle('active');
  }

  function saveConfig() {
    localStorage.setItem('gh_owner', document.getElementById('ghOwner').value.trim());
    localStorage.setItem('gh_repo', document.getElementById('ghRepo').value.trim());
    localStorage.setItem('gh_branch', document.getElementById('ghBranch').value.trim());
    localStorage.setItem('gh_token', document.getElementById('ghToken').value.trim());
    alert('GitHub 연동 정보가 브라우저에 저장되었습니다.');
    document.getElementById('configBar').classList.remove('active');
  }

  // 마크다운 미리보기 및 자동 임시저장
  function updatePreview() {
    const title = document.getElementById('postTitle').value;
    const raw = contentArea.value;
    localStorage.setItem('draft_title', title);
    localStorage.setItem('draft_content', raw);

    const renderedTitle = title ? `<h1>${title}</h1>` : '';
    previewArea.innerHTML = renderedTitle + marked.parse(raw);
  }

  // 에디터 텍스트 조작 유틸리티
  function wrapSelection(prefix, suffix) {
    const start = contentArea.selectionStart;
    const end = contentArea.selectionEnd;
    const selected = contentArea.value.substring(start, end) || '텍스트';
    const replacement = prefix + selected + suffix;

    contentArea.setRangeText(replacement, start, end, 'select');
    contentArea.focus();
    updatePreview();
  }

  function insertText(text) {
    const start = contentArea.selectionStart;
    contentArea.setRangeText(text, start, contentArea.selectionEnd, 'end');
    contentArea.focus();
    updatePreview();
  }

  function insertPrefix(prefix) {
    const start = contentArea.selectionStart;
    contentArea.setRangeText('\n' + prefix, start, contentArea.selectionEnd, 'end');
    contentArea.focus();
    updatePreview();
  }

  function insertHeading(levelPrefix) {
    if (!levelPrefix) return;
    insertPrefix(levelPrefix);
  }

  // 폰트 종류, 크기, 색상 조절 (HTML span 태그 활용)
  function applyFontFamily(font) {
    if (!font) return;
    wrapSelection(`<span style="font-family:${font};">`, `</span>`);
  }

  function applyFontSize(size) {
    if (!size) return;
    wrapSelection(`<span style="font-size:${size};">`, `</span>`);
  }

  // 표 생성 모달 제어
  function openTableModal() {
    document.getElementById('tableModal').classList.add('active');
  }
  function closeTableModal() {
    document.getElementById('tableModal').classList.remove('active');
  }

  function generateMarkdownTable() {
    const rows = parseInt(document.getElementById('tableRows').value, 10) || 3;
    const cols = parseInt(document.getElementById('tableCols').value, 10) || 3;
    const align = document.getElementById('tableAlign').value;

    let alignToken = '---';
    if (align === 'center') alignToken = ':---:';
    if (align === 'right') alignToken = '---:';

    let headerRow = '| ' + Array.from({length: cols}, (_, i) => `항목 ${i+1}`).join(' | ') + ' |';
    let dividerRow = '| ' + Array.from({length: cols}, () => alignToken).join(' | ') + ' |';
    let bodyRows = [];

    for (let r = 1; r <= rows; r++) {
      bodyRows.push('| ' + Array.from({length: cols}, (_, c) => `데이터 ${r}-${c+1}`).join(' | ') + ' |');
    }

    const tableMd = `\n${headerRow}\n${dividerRow}\n${bodyRows.join('\n')}\n\n`;
    insertText(tableMd);
    closeTableModal();
  }

  // UTF-8 문자열을 Base64로 안전하게 인코딩
  function utf8ToBase64(str) {
    return btoa(encodeURIComponent(str).replace(/%([0-9A-F]{2})/g, (_, p1) =>
      String.fromCharCode('0x' + p1)
    ));
  }

  // GitHub API를 호출하여 _posts 폴더에 마크다운 자동 생성 & 커밋
  async function publishPost() {
    const owner = document.getElementById('ghOwner').value.trim();
    const repo = document.getElementById('ghRepo').value.trim();
    const branch = document.getElementById('ghBranch').value.trim() || 'main';
    const token = document.getElementById('ghToken').value.trim();

    if (!token) {
      alert('상단의 [GitHub 연동 설정]을 눌러 Personal Access Token을 먼저 입력하고 저장해주세요.');
      document.getElementById('configBar').classList.add('active');
      return;
    }

    const title = document.getElementById('postTitle').value.trim();
    const category = document.getElementById('postCategory').value;
    const rawTags = document.getElementById('postTags').value.trim();
    const body = contentArea.value.trim();

    if (!title || !body) {
      alert('제목과 본문 내용을 모두 입력해주세요.');
      return;
    }

    const btn = document.getElementById('publishBtn');
    btn.disabled = true;
    btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> 등록 중...';

    try {
      // 한국 시간(KST) 기준 날짜 및 타임스탬프 생성
      const now = new Date();
      const yyyy = now.getFullYear();
      const mm = String(now.getMonth() + 1).padStart(2, '0');
      const dd = String(now.getDate()).padStart(2, '0');
      const hh = String(now.getHours()).padStart(2, '0');
      const min = String(now.getMinutes()).padStart(2, '0');
      const ss = String(now.getSeconds()).padStart(2, '0');

      const dateStr = `${yyyy}-${mm}-${dd}`;
      const fullTimeStr = `${dateStr} ${hh}:${min}:${ss} +0900`;

      // 파일명용 슬러그 생성 (한글/영문/숫자 유지 및 특수문자 제거)
      const slug = title
        .toLowerCase()
        .replace(/[^a-z0-9가-힣\s-]/g, '')
        .trim()
        .replace(/\s+/g, '-')
        .substring(0, 50) || `post-${hh}${min}${ss}`;

      const filePath = `_posts/${dateStr}-${slug}.md`;

      // 태그 배열 변환
      const tagsArray = rawTags
        ? rawTags.split(',').map(t => `"${t.trim()}"`).filter(Boolean).join(', ')
        : `"${category}"`;

      // Jekyll Chirpy 호환 YAML Front Matter 조립 (수식 렌더링 math: true 기본 활성화)
      const frontMatter = `---
title: "${title.replace(/"/g, '\\"')}"
date: ${fullTimeStr}
categories: ["${category}"]
tags: [${tagsArray}]
math: true
---

`;

      const finalMarkdown = frontMatter + body + '\n';
      const encodedContent = utf8ToBase64(finalMarkdown);

      const apiUrl = `https://api.github.com/repos/${owner}/${repo}/contents/${encodeURIComponent(filePath)}`;

      const response = await fetch(apiUrl, {
        method: 'PUT',
        headers: {
          'Authorization': `Bearer ${token}`,
          'Accept': 'application/vnd.github+json',
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          message: `post: ${title} (${category})`,
          content: encodedContent,
          branch: branch
        })
      });

      if (!response.ok) {
        const errData = await response.json();
        throw new Error(errData.message || 'GitHub API 업로드 실패');
      }

      // 임시저장 초기화
      localStorage.removeItem('draft_title');
      localStorage.removeItem('draft_content');

      alert(`게시글이 성공적으로 등록되었습니다!\n파일 경로: ${filePath}\n(GitHub Pages 빌드 완료까지 약 1~2분 후 블로그에 반영됩니다.)`);
      window.location.href = '/';
    } catch (error) {
      alert('게시글 등록 중 오류가 발생했습니다:\n' + error.message);
    } finally {
      btn.disabled = false;
      btn.innerHTML = '<i class="fa-solid fa-cloud-arrow-up"></i> 게시글 등록하기';
    }
  }
</script>
